name: AWS Deployment Checks

on:
  pull_request:
    paths:
      - build/Dockerfile
      - build/aws/**
      - src/backend/**
      - host/Zeeq.AspireHost.csproj
      - global.json
      - .config/dotnet-tools.json
      - .config/mise.toml
      - .github/workflows/aws-deployment-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: build/aws/package-lock.json
      - name: Restore .NET dependencies
        run: dotnet restore zeeq.slnx
      - name: Build the canonical runtime topology exporter
        run: dotnet build src/backend/Zeeq.Runtime.Server -c Release --no-restore --nologo
      - name: Verify AWS runtime primitives
        run: dotnet run --project src/backend/Zeeq.Platform.Storage.Aws.Tests -c Release -- --disable-logo
      - name: Install deployment dependencies
        run: npm ci --prefix build/aws
      - name: Check and verify infrastructure with mocks
        run: |
          npm run check --prefix build/aws
          npm run test --prefix build/aws
