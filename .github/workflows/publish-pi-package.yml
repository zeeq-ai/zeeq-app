# This workflow publishes the Pi lifecycle telemetry extension to the public
# npm registry as @zeeq-ai/zeeq-app-pi-telemetry, authenticating via npm
# trusted publishing (GitHub Actions OIDC) — no long-lived token stored in
# this repo. The package root is src/plugins/pi.
#
# Versioning is driven by semantic-release
# (https://semantic-release.gitbook.io), scoped to this one package via
# semantic-release-monorepo (https://github.com/pmowrer/semantic-release-monorepo):
#
#   1. semantic-release-monorepo filters the commit history down to only
#      commits that touched src/plugins/pi (relative to the last
#      @zeeq-ai/zeeq-app-pi-telemetry@<version> tag) before analyzing them —
#      an unrelated feat/fix commit elsewhere in the repo never triggers a
#      release here, and this workflow's own `paths` filter below means it
#      never even runs for those commits.
#   2. The next version is inferred entirely from conventional-commit
#      prefixes on those filtered commits (feat -> minor, fix -> patch,
#      BREAKING CHANGE/! -> major) — there is no `yarn changeset` step and no
#      per-PR changeset file to author.
#   3. On a release, the "Release" step below runs semantic-release, which
#      pushes a `@zeeq-ai/zeeq-app-pi-telemetry@<version>` git tag and
#      creates a GitHub Release with generated notes. It does NOT publish to
#      any registry itself (@semantic-release/npm is deliberately absent from
#      .releaserc.json), commit, or open a PR — the version checked into
#      src/plugins/pi/package.json is a static placeholder, and the tag and
#      the registry are the source of truth for what's actually published.
#   4. The steps after "Release" resolve the latest matching git tag and
#      check registry.npmjs.org for that exact version, publishing it if
#      missing. This is deliberately idempotent and decoupled from whether
#      *this* run released: the tag is pushed before the registry publish is
#      attempted, so a run whose npm publish fails still leaves the tag
#      behind, and a later rerun (workflow_dispatch, or the next push) sees
#      no new commits to release yet still finds the tagged version missing
#      from npmjs.org and republishes it. The publish step restores
#      src/plugins/pi from the tagged commit first, so a retry publishes the
#      contents that were tagged — not whatever newer commit happened to
#      trigger the rerun. Trusted publishing requires the @zeeq-ai npmjs.org
#      org to have this workflow file registered as a trusted publisher for
#      the package (npmjs.org package settings -> Trusted Publisher ->
#      GitHub Actions), and npm CLI >= 11.5.1.
#
# This repo has only one publishable package under src/plugins/** today. A
# future second package would get its own .releaserc.json (own tagFormat) and
# its own `paths` filter/job here.

name: Publish Pi Package

on:
  # semantic-release is self-gating (a run with no releasable commits since
  # the last tag is a no-op), but the paths filter avoids even starting the
  # job for pushes that never touched this package.
  push:
    branches:
      - main
    paths:
      - "src/plugins/pi/**"

  # Allow maintainers to re-run after a registry or workflow failure.
  workflow_dispatch:

concurrency:
  group: publish-pi-package
  cancel-in-progress: false

permissions:
  # checkout needs read access to the repository contents.
  contents: read

jobs:
  release:
    name: Release src/plugins/pi
    runs-on: ubuntu-latest
    permissions:
      # semantic-release pushes the release tag and creates the GitHub
      # Release. No pull-requests permission is needed -- this workflow never
      # opens a PR.
      contents: write
      # Required for npm trusted publishing (OIDC) to registry.npmjs.org --
      # no NPM_TOKEN secret is stored in this repo.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Release
        working-directory: src/plugins/pi
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The tag semantic-release just pushed (or a pre-existing one, if this
      # run released nothing) names the version that should exist on npm.
      # Resolving it from the tag list -- rather than from whether *this*
      # run produced a new version -- is what makes the registry-existence
      # check below idempotent: a rerun after a failed npm publish finds the
      # tag, finds the version still missing from npmjs.org, and republishes
      # it, even though semantic-release itself sees no new commits.
      - name: Resolve latest release tag
        id: tag
        run: |
          TAG=$(git tag --list '@zeeq-ai/zeeq-app-pi-telemetry@*' --sort=-v:refname | head -n1)
          echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#@zeeq-ai/zeeq-app-pi-telemetry@}" >> "$GITHUB_OUTPUT"

      # `npm view` on a public package needs no auth.
      - name: Check whether npm already has this version
        id: npm-check
        if: steps.tag.outputs.version != ''
        working-directory: src/plugins/pi
        run: |
          if npm view "@zeeq-ai/zeeq-app-pi-telemetry@${{ steps.tag.outputs.version }}" version >/dev/null 2>&1; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish missing version to npm
        if: steps.tag.outputs.version != '' && steps.npm-check.outputs.missing == 'true'
        working-directory: src/plugins/pi
        env:
          TAG_REF: ${{ steps.tag.outputs.ref }}
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # Trusted publishing requires npm CLI >= 11.5.1; pin to latest
          # rather than trust whatever setup-node's Node 24 bundles.
          npm install -g npm@latest

          # Publish the contents that were tagged, not the current checkout:
          # on a retry run triggered by a later commit, HEAD may contain
          # newer src/plugins/pi changes that must not ship under the older
          # tagged version. This restores only this package's subtree (cwd)
          # without moving HEAD; it's the job's last step, so the dirty
          # working tree it leaves behind doesn't matter. The tagged commit
          # still holds the static 0.0.0 placeholder version (semantic-
          # release never commits the computed version), so the real version
          # is written in from the tag name below.
          git checkout "$TAG_REF" -- .
          npm pkg set version="$TAG_VERSION"

          # The restore above resurrects whatever registry config the tagged
          # commit carried, and a scoped .npmrc mapping or a publishConfig
          # registry would silently redirect the publish away from
          # npmjs.org. Force the intended target regardless of what was
          # tagged (npm pkg set edits package.json only in this ephemeral
          # checkout; nothing is committed).
          rm -f .npmrc
          npm pkg set publishConfig.registry=https://registry.npmjs.org publishConfig.access=public

          # No auth token is configured, so npm uses trusted publishing
          # (OIDC) via the id-token permission granted at job level. The
          # registry and public access come from package.json's
          # publishConfig; npmjs.org is also npm's default registry.
          npm publish --provenance
