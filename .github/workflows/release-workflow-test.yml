name: Diagnose Docker DNS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Host DNS
        run: |
          cat /etc/resolv.conf
          getent hosts archive.ubuntu.com || true
          getent hosts security.ubuntu.com || true
          dig +time=3 +tries=1 archive.ubuntu.com || true
          dig +time=3 +tries=1 @1.1.1.1 archive.ubuntu.com || true
      - name: Container DNS and apt
        run: |
          docker run --rm mcr.microsoft.com/dotnet/aspnet:11.0.0 sh -c 'cat /etc/resolv.conf; ls -l /etc/resolv.conf; getent hosts archive.ubuntu.com || true; apt-get update; apt-get -o APT::Sandbox::User=root update' || true
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [dns]
              nameservers = ["1.1.1.1", "8.8.8.8"]
      - name: BuildKit DNS and apt
        run: |
          printf 'FROM mcr.microsoft.com/dotnet/aspnet:11.0.0\nRUN cat /etc/resolv.conf && getent hosts archive.ubuntu.com && apt-get -o APT::Update::Error-Mode=any update && apt-get install -y --no-install-recommends git curl ca-certificates\n' | docker buildx build --no-cache --progress=plain -f - .
